services:
  db:
    image: postgres:17
    container_name: slotlock-db
    environment:
      POSTGRES_USER: slotlock
      POSTGRES_PASSWORD: slotlock
      POSTGRES_DB: slotlock
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotlock -d slotlock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
